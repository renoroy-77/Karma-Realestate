name: KARMA Backend CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-security:
    name: Lint, Static Analysis & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks Secret Detection
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 2. Composer Security Audit
      - name: Run Composer Audit
        run: composer audit

      # 3. Laravel Pint Code Style
      - name: Run Laravel Pint (Code Style)
        run: vendor/bin/pint --test

      # 4. PHPStan / Larastan Static Analysis
      - name: Run PHPStan & Larastan Static Analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M

  integration-tests:
    name: PHPUnit HTTP Tests with Testcontainers / MySQL Service
    runs-on: ubuntu-latest
    needs: code-quality-and-security

    # Ephemeral Containerized Database (Testcontainers Pattern)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: karma_testing
          MYSQL_USER: karma_user
          MYSQL_PASSWORD: karma_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, pdo_mysql
          coverage: xdebug

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 5. Run Migrations & Seeders on Containerized MySQL
      - name: Run Database Migrations on MySQL Service
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: karma_testing
          DB_USERNAME: karma_user
          DB_PASSWORD: karma_password
        run: php artisan migrate:fresh --seed

      # 6. Run PHPUnit / Pest HTTP Test Suites
      - name: Execute PHPUnit / Pest HTTP Test Suites
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: karma_testing
          DB_USERNAME: karma_user
          DB_PASSWORD: karma_password
        run: php artisan test --parallel

  performance-and-dast:
    name: k6 Load Test & OWASP Security Baseline
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP & Run Local Server
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-progress --prefer-dist
      - run: touch database/database.sqlite && php artisan migrate:fresh --seed
      - run: php artisan serve --port=8000 &
        env:
          DB_CONNECTION: sqlite

      # 7. k6 Performance Smoke Test
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/load-test.js
          flags: --vus 10 --duration 10s
